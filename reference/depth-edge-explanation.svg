<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title description">
  <title id="title">Запас глубины за прозрачным контуром PNG</title>
  <desc id="description">Сверху показан резкий переход от глубины героя к фону на контуре PNG. Снизу та же глубина героя продолжается технической полосой за прозрачный контур и только дальше плавно переходит к фону. На фотографии эта полоса прозрачная и не видна.</desc>
  <defs>
    <clipPath id="current-row"><rect x="280" y="94" width="680" height="74" rx="8"/></clipPath>
    <clipPath id="prepared-row"><rect x="280" y="246" width="680" height="74" rx="8"/></clipPath>
    <linearGradient id="outer-depth" x1="680" y1="0" x2="820" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#aaa"/>
      <stop offset="1" stop-color="#111"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="420" fill="#090909"/>
  <g font-family="Arial, sans-serif">
    <text x="32" y="38" fill="#fff" font-size="24" font-weight="600">Край карты глубины</text>
    <text x="560" y="76" fill="#fff" font-size="18" text-anchor="middle">Контур PNG</text>

    <text x="32" y="138" fill="#fff" font-size="22">Сейчас</text>
    <g clip-path="url(#current-row)">
      <rect x="280" y="94" width="680" height="74" fill="#111"/>
      <rect x="280" y="94" width="280" height="74" fill="#aaa"/>
    </g>
    <rect x="280" y="94" width="680" height="74" rx="8" fill="none" stroke="#333"/>
    <text x="420" y="138" fill="#222" font-size="18" text-anchor="middle">Глубина героя</text>
    <text x="850" y="138" fill="#aaa" font-size="18" text-anchor="middle">Глубина фона</text>
    <line x1="560" y1="86" x2="560" y2="178" stroke="#fff" stroke-width="2" stroke-dasharray="4 5"/>
    <text x="280" y="198" fill="#aaa" font-size="17">Резкий перепад глубины совпадает с краем фото.</text>

    <text x="32" y="274" fill="#fff" font-size="22">Подготовленная</text>
    <text x="32" y="302" fill="#fff" font-size="22">карта</text>
    <g clip-path="url(#prepared-row)">
      <rect x="280" y="246" width="680" height="74" fill="#111"/>
      <rect x="280" y="246" width="400" height="74" fill="#aaa"/>
      <rect x="680" y="246" width="140" height="74" fill="url(#outer-depth)"/>
    </g>
    <rect x="280" y="246" width="680" height="74" rx="8" fill="none" stroke="#333"/>
    <text x="420" y="290" fill="#222" font-size="18" text-anchor="middle">Глубина героя</text>
    <text x="850" y="290" fill="#aaa" font-size="18" text-anchor="middle">Глубина фона</text>
    <line x1="560" y1="238" x2="560" y2="330" stroke="#fff" stroke-width="2" stroke-dasharray="4 5"/>

    <path d="M560 335 V344 H680 V335" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="620" y="371" fill="#fff" font-size="20" text-anchor="middle">Запас глубины за контуром</text>
    <text x="620" y="400" fill="#aaa" font-size="17" text-anchor="middle">На фото эта область прозрачная и не видна</text>
  </g>
</svg>
