<!doctype html><meta charset="utf-8"><title>Video reference 036</title>
<style>body{margin:0;background:#151515;color:white;font:14px sans-serif}video{display:block;width:100%;height:85vh;object-fit:contain}nav{display:flex;gap:12px;padding:12px}button{padding:10px}</style>
<video id="reference" src="./036-source.mp4" controls preload="auto"></video>
<nav><button data-at="0">0%</button><button data-at=".15">15%</button><button data-at=".3">30%</button><button data-at=".5">50%</button><button data-at=".7">70%</button><button data-at=".9">90%</button></nav>
<script>const video=document.querySelector('video');fetch('./036-source.mp4').then(r=>r.arrayBuffer()).then(bytes=>{video.src=URL.createObjectURL(new Blob([bytes],{type:'video/mp4'}));});document.querySelectorAll('button').forEach(button=>button.onclick=()=>{video.pause();video.currentTime=video.duration*Number(button.dataset.at);});</script>
