<!doctype html><html class="is-site-loading"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../site-preloader.css"></head><body>    <section class="site-preloader" data-site-preloader data-state="loading" style="--load-progress:0.68" role="dialog" aria-modal="true" aria-label="Loading portfolio" aria-busy="true" tabindex="-1">
      <div class="site-preloader__stage">
        <div class="site-preloader__progress" data-preloader-progress role="progressbar" aria-label="Loading first screen" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <svg class="site-preloader__ring" width="200" height="200" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
            <circle class="site-preloader__ring-base" cx="100" cy="100" r="99.5" />
            <circle class="site-preloader__ring-fill" cx="100" cy="100" r="99.5" pathLength="100" transform="rotate(-90 100 100) translate(0 200) scale(1 -1)" />
          </svg>
        </div>
        <button class="site-preloader__button" data-preloader-enter type="button" aria-label="Enter portfolio" aria-describedby="site-preloader-status" disabled><span data-preloader-label>68%</span></button>
      </div>
      <p class="visually-hidden" id="site-preloader-status" data-preloader-status role="status" aria-live="polite">Loading the first screen</p>
      <button class="site-preloader__retry" data-preloader-retry type="button" hidden>Retry</button>
    </section>
</body></html>
